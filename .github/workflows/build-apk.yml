
name: Build Hannah APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Hannah project
        run: |
          unzip Hannah_Android_Project.zip -d /tmp/hannah
          cp -R /tmp/hannah/Hannah_Android_Project/app .
          cp /tmp/hannah/Hannah_Android_Project/build.gradle.kts .
          cp /tmp/hannah/Hannah_Android_Project/settings.gradle.kts .
          cp /tmp/hannah/Hannah_Android_Project/gradle.properties .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Build Hannah APK
        run: gradle assembleDebug

      - name: Upload Hannah APK
        uses: actions/upload-artifact@v4
        with:
          name: Hannah-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
